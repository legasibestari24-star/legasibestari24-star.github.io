<!DOCTYPE html>
<html lang="ms"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>E-Bestari 2.0</title><link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f5b400">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#f4f7fb;--card:#fff;--tx:#14213d;--mut:#5c6b80;--pri:#1d4ed8;--ok:#15803d;--bd:#d9e1ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f172a;--card:#1e293b;--tx:#f1f5f9;--mut:#94a3b8;--pri:#60a5fa;--ok:#4ade80;--bd:#334155}}
:root[data-theme="dark"]{--bg:#0f172a;--card:#1e293b;--tx:#f1f5f9;--mut:#94a3b8;--pri:#60a5fa;--ok:#4ade80;--bd:#334155}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:480px;margin:0 auto;min-height:100%;padding:20px 16px 100px;display:flex;flex-direction:column;gap:14px}
h1{font-size:1.5rem;margin:0}h2{font-size:1.2rem;margin:0}p{margin:0;color:var(--mut)}
.c{text-align:center}.splash{justify-content:center;align-items:center;min-height:90vh}
.logo{width:130px;height:130px;border-radius:50%;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;font-size:3.4rem;font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.u,.opt{background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:16px 10px;font-size:1rem;color:var(--tx);text-align:center;cursor:pointer}
.u.sel,.opt.sel{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 15%,var(--card))}
.btn{background:var(--pri);color:#fff;border:0;border-radius:12px;padding:14px;font-size:1rem;font-weight:700;width:100%;cursor:pointer}
.btn.alt{background:var(--card);color:var(--tx);border:2px solid var(--bd)}.btn:disabled{opacity:.4}
input[type=date]{width:100%;padding:14px;font-size:1.1rem;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--tx)}
.row{display:flex;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--bd)}
.bar>div{max-width:480px;margin:0 auto;display:flex;gap:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:24px;z-index:9}
.modal>div{background:var(--card);border-radius:18px;padding:24px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px;text-align:center}
.tot{background:var(--ok);color:#fff;border-radius:14px;padding:16px;text-align:center;font-size:1.3rem;font-weight:800}
.nav{display:flex;align-items:center;justify-content:space-between}.nav button{border:0;background:var(--card);color:var(--tx);border-radius:10px;padding:10px 16px;font-size:1.1rem}
.dots{display:flex;gap:14px;justify-content:center;margin:8px 0}.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--pri)}.dots i.on{background:var(--pri)}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pad button{padding:18px;font-size:1.4rem;border-radius:14px;border:2px solid var(--bd);background:var(--card);color:var(--tx)}.rec{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer}.rec:active{border-color:var(--pri)}.lnk{background:none;border:0;color:var(--pri);font-size:1rem;padding:8px;cursor:pointer}
</style></head><body><div id="app"></div>

   h+=mine.length?`<p class="c"><small>Tekan dan tahan rekod selama 3 saat untuk padam atau edit</small></p>`+mine.map(r=>`<div class="row rec" onpointerdown="hs('${r.date}','${r.cls}')" onpointerup="hc()" onpointerleave="hc()" onpointercancel="hc()" oncontextmenu="return false"><span>${fdate(r.date)}<br><small>${r.cls}</small></span><b>${fmt(r.pay)}</b></div>`).join(""):`<p class="c">Tiada rekod bulan ini</p>`;
   h+=`<div class="tot">Jumlah gaji: ${fmt(mine.reduce((a,r)=>a+r.pay,0))}<br><small>${mine.length} tugasan</small></div>`}
  if(all.length)h+=`<button class="btn alt" onclick="go('bulan')">Rekod Keseluruhan Sebulan</button>`;
  h+=bar("","go('menu')","Kembali ke Menu")}
 else if(S.page==="bulan"){
  const rs=monthRecs(),[y,m]=S.ym.split("-"),g=c=>rs.filter(r=>(r.cls==="Kelas Mengaji")===c);
  const ng=g(false),mg=g(true),sum=a=>a.reduce((t,r)=>t+r.pay,0);
  h=`<h2>Rekod Keseluruhan Sebulan</h2><p>${S.user} · ${MON[+m-1]} ${y}</p>`;
  h+=rs.length?rs.map(r=>`<div class="row"><span>${fdate(r.date)}<br><small>${r.cls}</small></span><b>${fmt(r.pay)}</b></div>`).join("")+`<div class="row"><span>Mengajar (${ng.length})</span><b>${fmt(sum(ng))}</b></div><div class="row"><span>Mengaji (${mg.length})</span><b>${fmt(sum(mg))}</b></div><div class="tot">Jumlah gaji: ${fmt(sum(rs))}</div>`:`<p class="c">Tiada rekod bulan ini</p>`;
  h+=bar("go('rekod')","shareWA()","SHARE KE WHATSAPP",!rs.length)}
 if(S.page==="bak"){const ta="width:100%;min-height:90px;padding:10px;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font-size:.8rem";
  h=`<h2>Sandaran Rekod</h2><p>Hanya rekod ${S.user} disimpan dalam kod ini. Simpan kod di tempat selamat (contoh: WhatsApp sendiri).</p><textarea id="bk" readonly style="${ta}">${backupCode()}</textarea><button class="btn" onclick="copyBk()">Salin Kod Sandaran</button><button class="btn alt" onclick="waBk()">Hantar ke WhatsApp</button><h2 style="margin-top:12px">Pulihkan Rekod</h2><p>Tampal kod sandaran ${S.user} di bawah.</p><textarea id="rs" placeholder="EBESTARI2:..." style="${ta}"></textarea><button class="btn" onclick="doRestore()">Pulihkan</button><p class="c" style="color:var(--ok);font-weight:700">${S.msg||""}</p>`+bar("","go('menu')","Kembali ke Menu")}
 if(S.page==="pin"){const nw=S.pinMode==="new";
  const t=nw?(S.pinStep===1?"Cipta PIN 4 digit":"Sahkan PIN anda"):"Masukkan PIN anda";
  h=`<div class="c"><h2>${S.user}</h2><p>${t}</p></div><div class="dots">${[0,1,2,3].map(i=>`<i class="${i<S.pin.length?"on":""}"></i>`).join("")}</div><p class="c" style="color:#dc2626;min-height:1.3em">${S.err||""}</p><div class="pad">${[1,2,3,4,5,6,7,8,9].map(d=>`<button onclick="key('${d}')">${d}</button>`).join("")}<span></span><button onclick="key('0')">0</button><button onclick="key('<')">⌫</button></div><div class="c">${nw?"":`<button class="lnk" onclick="S.err2='';S.modal='forgot';render()">Lupa PIN?</button>`}<button class="lnk" onclick="S.user=null;go('user')">Tukar Pengguna</button></div>`}
 if(S.modal==="user")h+=`<div class="modal"><div><h2>Pengguna Dipilih</h2><p>Hai ${S.user}</p><button class="btn" onclick="S.modal=null;startPin()">OK</button></div></div>`;
 if(S.modal==="saved")h+=`<div class="modal"><div><h2 style="color:var(--ok)">REKOD BERJAYA DISIMPAN</h2><button class="btn" onclick="S.modal=null;go('menu')">KEMBALI KE MENU UTAMA</button></div></div>`;
 if(S.modal==="rec"&&S.sel)h+=`<div class="modal"><div><h2>Rekod Dipilih</h2><p>${fdate(S.sel.date)}<br>${S.sel.cls}</p><button class="btn" style="background:#dc2626" onclick="delRec()">PADAM</button><button class="btn" onclick="editRec()">EDIT</button><button class="btn alt" onclick="S.modal=null;render()">Batal</button></div></div>`;
 if(S.modal==="forgot")h+=`<div class="modal"><div><h2>Lupa PIN</h2><p>Masukkan kod admin untuk set semula PIN ${S.user}. Rekod tidak akan dipadam.</p><input id="ak" type="password" inputmode="numeric" placeholder="Kod admin" style="padding:14px;font-size:1.1rem;border-radius:12px;border:2px solid var(--bd);background:var(--bg);color:var(--tx)"><p style="color:#dc2626">${S.err2||""}</p><button class="btn" onclick="doReset()">Set Semula PIN</button><button class="btn alt" onclick="S.modal=null;render()">Batal</button></div></div>`;
 app.innerHTML=h;
}
function monthRecs(){return load().filter(r=>r.user===S.user&&r.date.startsWith(S.ym)).sort((a,b)=>a.date.localeCompare(b.date))}
function shareWA(){const rs=monthRecs(),[y,m]=S.ym.split("-");let t=`*REKOD ${MON[+m-1].toUpperCase()} ${y}*\nNama: ${S.user}\n\n`;
 rs.forEach(r=>{t+=`${fdate(r.date)} - ${r.cls} (${fmt(r.pay)})\n`});
 const ng=rs.filter(r=>r.cls!=="Kelas Mengaji"),mg=rs.filter(r=>r.cls==="Kelas Mengaji"),s=a=>a.reduce((x,r)=>x+r.pay,0);
 t+=`\nMengajar: ${ng.length} kelas = ${fmt(s(ng))}\nMengaji: ${mg.length} kelas = ${fmt(s(mg))}\n*Jumlah gaji: ${fmt(s(rs))}*`;
 window.open("https://wa.me/?text="+encodeURIComponent(t),"_blank")}
function backupCode(){return "EBESTARI2:"+btoa(JSON.stringify({user:S.user,recs:load().filter(r=>r.user===S.user),pin:loadPins()[S.user]||null}))}
function copyBk(){const c=backupCode(),el=document.getElementById("bk");
 const ok=()=>{markBak();S.msg="Kod berjaya disalin";render()},no=()=>{el.select();try{document.execCommand("copy")?ok():(S.msg="Tekan lama pada kod untuk salin",render())}catch(e){S.msg="Tekan lama pada kod untuk salin";render()}};
 try{navigator.clipboard.writeText(c).then(ok,no)}catch(e){no()}}
function waBk(){markBak();window.open("https://wa.me/?text="+encodeURIComponent("Sandaran E-Bestari ("+S.user+")\n"+backupCode()),"_blank")}
function doRestore(){const v=document.getElementById("rs").value.trim().replace(/^.*?(EBESTARI2:)/s,"$1");
 if(!v.startsWith("EBESTARI2:")){S.msg="";alert2("Kod tidak sah");return}
 let d;try{d=JSON.parse(atob(v.slice(10).replace(/\s/g,"")))}catch(e){alert2("Kod rosak atau tidak lengkap");return}
 if(d.user!==S.user){alert2("Kod ini milik "+d.user+", bukan "+S.user);return}
 const all=load(),seen=new Set(all.map(r=>r.user+r.date+r.cls));let n=0;
 (d.recs||[]).forEach(r=>{if(r&&/^\d{4}-\d{2}-\d{2}$/.test(r.date)&&CLASSES.includes(r.cls)){const k=S.user+r.date+r.cls;if(!seen.has(k)){seen.add(k);all.push({user:S.user,date:r.date,cls:r.cls,pay:RATE(r.cls)});n++}}});
 save(all);const ps=loadPins();if(d.pin&&!ps[S.user]){ps[S.user]=d.pin;savePins(ps)}
 S.msg="Berjaya dipulihkan: "+n+" rekod baharu";render()}
function alert2(t){S.msg=t;render()}
let HT=null;
function hs(d,c){hc();HT=setTimeout(()=>{HT=null;S.sel={date:d,cls:c};S.modal="rec";try{navigator.vibrate&&navigator.vibrate(40)}catch(e){}render()},3000)}
function hc(){if(HT){clearTimeout(HT);HT=null}}
function delRec(){const r=load(),i=r.findIndex(x=>x.user===S.user&&x.date===S.sel.date&&x.cls===S.sel.cls);if(i>-1)r.splice(i,1);save(r);S.modal=null;S.sel=null;render()}
function editRec(){S.editing={date:S.sel.date,cls:S.sel.cls};S.date=S.sel.date;S.cls=S.sel.cls;S.modal=null;go("date")}
function bakTarget(){const d=new Date(),last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),dd=d.getDate();
 if(dd>=last-2)return TODAY().slice(0,7);
 if(dd<=2){const p=new Date(d.getFullYear(),d.getMonth()-1,1);return p.getFullYear()+"-"+String(p.getMonth()+1).padStart(2,"0")}
 return null}
function bakDue(){const t=bakTarget();if(!t)return false;try{return JSON.parse(localStorage.getItem("ebestari2_bak")||"{}")[S.user]!==t}catch(e){return true}}
function markBak(){const t=bakTarget();if(!t)return;try{const o=JSON.parse(localStorage.getItem("ebestari2_bak")||"{}");o[S.user]=t;localStorage.setItem("ebestari2_bak",JSON.stringify(o))}catch(e){}}
const PKEY="ebestari2_pins";
function loadPins(){try{return JSON.parse(localStorage.getItem(PKEY))||{}}catch(e){return{}}}
function savePins(p){try{localStorage.setItem(PKEY,JSON.stringify(p))}catch(e){}}
async function hash(s){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("bestari:"+S.user+":"+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return"p"+btoa(s)}}
function startPin(){S.pin="";S.err="";S.pinFirst="";S.pinStep=1;S.busy=false;S.pinMode=loadPins()[S.user]?"enter":"new";go("pin")}
function key(d){if(S.busy)return;if(d==="<")S.pin=S.pin.slice(0,-1);else if(S.pin.length<4)S.pin+=d;S.err="";render();if(S.pin.length===4)submitPin()}
async function submitPin(){S.busy=true;const p=S.pin,ps=loadPins();
 if(S.pinMode==="enter"){if(await hash(p)===ps[S.user]){S.busy=false;S.pin="";go("menu")}else{S.err="PIN salah";S.pin="";S.busy=false;render()}}
 else if(S.pinStep===1){S.pinFirst=p;S.pinStep=2;S.pin="";S.busy=false;render()}
 else if(p===S.pinFirst){ps[S.user]=await hash(p);savePins(ps);S.busy=false;S.pin="";go("menu")}
 else{S.err="PIN tidak sama, cuba semula";S.pinStep=1;S.pin="";S.busy=false;render()}}
function doReset(){if(document.getElementById("ak").value===ADMIN_KOD){const ps=loadPins();delete ps[S.user];savePins(ps);S.modal=null;startPin()}else{S.err2="Kod admin salah";render()}}
function pick(i){S.user=USERS[i];S.modal="user";render()}
function shift(d){let[y,m]=S.ym.split("-").map(Number);m+=d;if(m<1){m=12;y--}if(m>12){m=1;y++}S.ym=`${y}-${String(m).padStart(2,"0")}`;render()}
function saveRec(){const r=load();if(S.editing){const i=r.findIndex(x=>x.user===S.user&&x.date===S.editing.date&&x.cls===S.editing.cls);if(i>-1)r.splice(i,1);S.editing=null}r.push({user:S.user,date:S.date,cls:S.cls,pay:RATE(S.cls)});save(r);S.ym=S.date.slice(0,7);S.modal="saved";render()}
render();setTimeout(()=>go("user"),3000);
</script><script>if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script></body></html>
